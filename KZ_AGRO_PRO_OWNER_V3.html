</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="logo">✦</div><div>KZ AGRO <span style="color:#65d4a4">PRO</span><div style="font-size:10px;font-weight:500;color:#8bb5a3;margin-top:3px">BUSINESS MANAGEMENT</div></div></div><div class="nav-title">OVERVIEW</div><button class="nav active" data-page="dashboard"><span class="ico">▦</span> Dashboard HQ</button><div class="nav-title">OPERASI</div><button class="nav" data-page="jualan"><span class="ico">▤</span> Jualan & Invois</button><button class="nav" data-page="pembelian"><span class="ico">🛒</span> Pembelian Buah</button><button class="nav" data-page="stok"><span class="ico">▣</span> Stok & Pindahan</button><button class="nav" data-page="hutang"><span class="ico">♧</span> Hutang & Bayaran</button><div class="nav-title">KEWANGAN</div><button class="nav" data-page="bank"><span class="ico">▥</span> Tunai & Bank</button><button class="nav" data-page="laporan"><span class="ico">▥</span> Laporan</button><div class="nav-title">PENGURUSAN</div><button class="nav" data-page="tetapan"><span class="ico">⚙</span> Tetapan & Sandaran</button><div style="padding:25px 12px;color:#8fb4a3;font-size:11px">● Mod pemilik · data peranti</div></aside><div class="workspace"><header class="topbar"><div class="left"><div class="logo" style="width:33px;height:33px">✦</div><div><strong>KZ AGRO RESOURCES</strong><div class="muted">Owner Workspace · HQ Control</div></div></div><div style="display:flex;align-items:center;gap:9px"><span class="pill">● OWNER MODE</span><div class="avatar">KZ</div></div></header><main class="content" id="app"></main></div></div><nav class="bottomnav"><button data-page="dashboard" class="active"><span>⌂</span>Utama</button><button data-page="jualan"><span>▤</span>Jualan</button><button data-page="pembelian"><span>🛒</span>Beli</button><button data-page="stok"><span>▣</span>Stok</button><button data-page="tetapan"><span>☷</span>Lagi</button></nav><script>
'use strict';
const KEY='kz_owner_v2';const branches=['KZ Agro HQ','Station 88','Station 77'];const accounts=['Tunai','Maybank','Public Bank'];const products=['Josa Baby','Josa F','Josa E','Josa D','Josa C','MD2 A','MD2 B','Lain-lain'];const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const money=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>Number(x)||0;const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,7);const opt=(arr,selected)=>arr.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('');const title=(name,sub,actions='')=>`<div class="heading"><div><div class="eyebrow">KZ AGRO / OWNER WORKSPACE</div><h1>${name}</h1><p class="muted">${sub}</p></div><div class="actions">${actions}</div></div>`;const panel=(name,body)=>`<section class="panel"><div class="panel-head"><h2>${name}</h2></div><div class="panel-body">${body}</div></section>`;const table=(headers,rows)=>`<div class="tablewrap"><table class="tbl"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Belum ada rekod</td></tr>`}</tbody></table></div>`;
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.docs))db={docs:[],payments:[],transfers:[],adjustments:[],movements:[],bank:[],opening:{},settings:{}};for(const k of ['payments','transfers','adjustments','movements','bank'])if(!Array.isArray(db[k]))db[k]=[];let page='dashboard',mode='sale',lines=[{product:'Josa D',qty:1,price:1.5}],lastBill=null;function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function notify(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}function nav(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));function docs(type){return db.docs.filter(d=>d.type===type)}function paid(d){return db.payments.filter(p=>p.docId===d.id).reduce((a,p)=>a+p.amount,0)}function balance(d){return Math.max(0,d.total-paid(d))}function stock(branch,product){return db.movements.filter(m=>m.branch===branch&&m.product===product).reduce((a,m)=>a+m.qty,0)}function revenue(date){return docs('sale').filter(d=>d.date===date).reduce((a,d)=>a+d.total,0)}function previousDay(d){let t=new Date(d+'T12:00:00');t.setDate(t.getDate()-1);return t.toLocaleDateString('en-CA')}function branchSales(b){return docs('sale').filter(d=>d.branch===b&&d.date===today()).reduce((a,d)=>a+d.total,0)}function chart(){const data=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let s=d.toLocaleDateString('en-CA');return{label:d.toLocaleDateString('ms-MY',{day:'numeric',month:'short'}),value:revenue(s)}});const max=Math.max(1,...data.map(x=>x.value));return `<svg class="chart" viewBox="0 0 610 230" preserveAspectRatio="none" role="img" aria-label="Graf jualan tujuh hari">${[0,1,2,3].map(i=>`<line x1="36" y1="${26+i*52}" x2="600" y2="${26+i*52}" stroke="#edf1ed"/><text x="3" y="${30+i*52}">${Math.round(max*(3-i)/3)}</text>`).join('')}${data.map((x,i)=>{let h=150*x.value/max;return `<rect x="${65+i*77}" y="${183-h}" width="39" height="${h}" rx="6" fill="${i===6?'#16865e':'#b6e5ca'}"/><text x="${84+i*77}" y="214" text-anchor="middle">${x.label}</text>`}).join('')}</svg>`}
function dashboard(){let t=revenue(today()),y=revenue(previousDay(today())),diff=y?((t-y)/y*100):null,receiv=docs('sale').reduce((a,d)=>a+balance(d),0),payab=docs('purchase').reduce((a,d)=>a+balance(d),0),sales=docs('sale').slice().reverse().slice(0,6);let max=Math.max(1,...branches.map(branchSales));return title('Dashboard HQ','Ringkasan operasi perniagaan · '+new Date().toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'}),`<button class="btn" onclick="newBill('sale')">＋ Jualan Baru</button>`)+`<div class="notice">VERSI PEMILIK SETEMPAT: Data disimpan dalam pelayar pada peranti ini. Belum ada login, penyegerakan cawangan atau integrasi bank. Jangan gunakan sebagai satu-satunya rekod kewangan rasmi. Eksport sandaran setiap hari.</div><div class="kpis"><div class="panel kpi"><div class="kpi-top">Jualan Hari Ini <span class="kpi-icon">↗</span></div><div class="value">${money(t)}</div><div class="kpi-foot">${diff===null?'Tiada jualan semalam untuk perbandingan':`<span class="${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${Math.abs(diff).toFixed(1)}%</span> berbanding semalam`}</div></div><div class="panel kpi"><div class="kpi-top">Jualan Bulan Ini <span class="kpi-icon">▥</span></div><div class="value">${money(docs('sale').filter(d=>d.date.slice(0,7)===today().slice(0,7)).reduce((a,d)=>a+d.total,0))}</div><div class="kpi-foot">Jumlah invois direkodkan</div></div><div class="panel kpi"><div class="kpi-top">Hutang Pelanggan <span class="kpi-icon">♧</span></div><div class="value">${money(receiv)}</div><div class="kpi-foot">Baki belum diterima</div></div><div class="panel kpi"><div class="kpi-top">Hutang Pembekal <span class="kpi-icon">▤</span></div><div class="value">${money(payab)}</div><div class="kpi-foot">Baki belum dibayar</div></div></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Prestasi Jualan</h2><span class="muted">7 hari terakhir</span></div><div class="panel-body">${chart()}</div></section><section class="panel"><div class="panel-head"><h2>Prestasi Cawangan</h2><span class="muted">Hari ini</span></div><div class="panel-body">${branches.map(b=>`<div class="branch"><div class="branch-line"><span>${esc(b)}</span><span>${money(branchSales(b))}</span></div><div class="bar"><span style="width:${branchSales(b)/max*100}%"></span></div></div>`).join('')}</div></section></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Transaksi Terkini</h2><button class="btn secondary" onclick="nav('jualan')">Lihat Semua</button></div>${table(['Tarikh','No. Invois','Pelanggan','Jumlah'],sales.map(d=>`<tr><td>${esc(d.date)}</td><td>${esc(d.ref)}</td><td>${esc(d.party)}</td><td><b>${money(d.total)}</b></td></tr>`).join(''))}</section>${panel('Tindakan Pantas',`<div class="quick"><button onclick="newBill('sale')"><span>▤</span>Jualan</button><button onclick="newBill('purchase')"><span>🛒</span>Beli Buah</button><button onclick="nav('stok')"><span>▣</span>Semak Stok</button><button onclick="nav('hutang')"><span>♧</span>Hutang</button></div><p class="muted spaced">Pembelian dan jualan akan mengemas kini stok serta baki hutang secara automatik.</p>`)}</div>`}
function newBill(type){mode=type;lines=[{product:type==='sale'?'Josa D':'Josa C',qty:1,price:type==='sale'?1.5:1.1}];page=type==='sale'?'jualan':'pembelian';render(true)}function lineHTML(){return lines.map((l,i)=>`<div class="line-row"><div><label>Produk / Gred</label><select onchange="changeLine(${i},'product',this.value)">${opt(products,l.product)}</select></div><div><label>Kuantiti</label><input type="number" min="0.001" step="any" value="${l.qty}" oninput="changeLine(${i},'qty',this.value)"></div><div><label>Harga RM</label><input type="number" min="0" step="any" value="${l.price}" oninput="changeLine(${i},'price',this.value)"></div><div><label>Jumlah</label><input disabled value="${money(l.qty*l.price)}"></div><button class="btn secondary remove" onclick="removeLine(${i})" title="Buang baris">✕</button></div>`).join('')}function refreshLineTotals(){document.querySelectorAll('#lineholder .line-row').forEach((row,i)=>{let output=row.querySelector('input[disabled]');if(output&&lines[i])output.value=money(lines[i].qty*lines[i].price)});let total=document.getElementById('lineTotal');if(total)total.textContent=money(lines.reduce((a,l)=>a+num(l.qty)*num(l.price),0))}
function changeLine(i,k,v){if(!lines[i])return;lines[i][k]=k==='product'?v:num(v);refreshLineTotals()}
function addLine(){lines.push({product:mode==='purchase'?'Josa C':'Josa D',qty:1,price:0});document.getElementById('lineholder').innerHTML=lineHTML();refreshLineTotals()}
function removeLine(i){if(lines.length===1)return notify('Perlu sekurang-kurangnya satu produk');lines.splice(i,1);document.getElementById('lineholder').innerHTML=lineHTML();refreshLineTotals()}
function formBill(type){let sale=type==='sale';return `<div class="panel"><div class="panel-body"><form id="billform" onsubmit="saveBill(event,'${type}')"><div class="form-grid"><div><label>Tarikh</label><input name="date" type="date" value="${today()}" required></div><div><label>${sale?'Pelanggan':'Pembekal / Kebun'}</label><input name="party" placeholder="Nama ${sale?'pelanggan':'pembekal'}" required></div><div><label>Cawangan / Lokasi Stok</label><select name="branch">${opt(branches,branches[0])}</select></div><div><label>No. Rujukan (pilihan)</label><input name="ref" placeholder="Auto jika kosong"></div><div><label>Bayaran Awal RM</label><input name="initial" type="number" min="0" step="any" value="0"></div><div><label>Akaun Bayaran</label><select name="account">${opt(accounts,'Tunai')}</select></div></div><h2 style="margin:23px 0 12px">Senarai Produk</h2><div id="lineholder">${lineHTML()}</div><button type="button" class="btn secondary" onclick="addLine()">＋ Tambah Produk</button><div class="summary"><span>Jumlah Bil</span><span id="lineTotal">${money(lines.reduce((a,l)=>a+l.qty*l.price,0))}</span></div><div class="actions"><button class="btn" type="submit">✓ Simpan & Kemaskini Stok</button><button class="btn outline" type="button" onclick="render()">Batal</button></div><p class="muted spaced">Bil yang disimpan akan diposkan sekali ke stok, hutang dan lejar bayaran. Padam atau ubah bil yang telah diposkan tidak disediakan dalam versi ini.</p></form></div></div>`}function saveBill(e,type){e.preventDefault();let f=new FormData(e.target),items=lines.map(l=>({...l,qty:num(l.qty),price:num(l.price)}));if(items.some(l=>!Number.isFinite(l.qty)||!Number.isFinite(l.price)||l.qty<=0||l.price<0))return notify('Semak kuantiti dan harga');let total=items.reduce((a,l)=>a+l.qty*l.price,0),initial=num(f.get('initial'));if(initial<0||initial>total)return notify('Bayaran awal tidak sah');let branch=f.get('branch');if(type==='sale'){for(let l of items){let available=stock(branch,l.product);if(available<items.filter(x=>x.product===l.product).reduce((a,x)=>a+x.qty,0))return notify(`Stok ${l.product} tidak cukup di ${branch}. Ada ${available}`)}}let d={id:uid(),type,date:f.get('date'),party:String(f.get('party')).trim(),branch,ref:String(f.get('ref')).trim()||((type==='sale'?'INV':'BEL')+'-'+Date.now().toString().slice(-8)),items,total};if(!d.party)return notify('Isi nama pelanggan/pembekal');db.docs.push(d);items.forEach(l=>db.movements.push({id:uid(),date:d.date,branch,product:l.product,qty:l.qty*(type==='purchase'?1:-1),source:d.id}));if(initial>0)addPayment(d,initial,f.get('account'),d.date);persist();lastBill=d.id;lines=[{product:'Josa D',qty:1,price:0}];render();notify('Bil disimpan, stok dan lejar dikemas kini')}function addPayment(d,amount,account,date){db.payments.push({id:uid(),docId:d.id,date,amount,account});db.bank.push({id:uid(),date,account,amount:amount*(d.type==='sale'?1:-1),description:(d.type==='sale'?'Terima bayaran ':'Bayar pembekal ')+d.ref,source:d.id})}function billList(type){let arr=docs(type).slice().reverse();return `<section class="panel"><div class="panel-head"><h2>Senarai ${type==='sale'?'Invois':'Bil Pembelian'}</h2><span class="muted">${arr.length} rekod</span></div>${table(['Tarikh','No. Bil',type==='sale'?'Pelanggan':'Pembekal','Cawangan','Jumlah','Baki','Cetak'],arr.map(d=>`<tr><td>${esc(d.date)}</td><td><b>${esc(d.ref)}</b></td><td>${esc(d.party)}</td><td>${esc(d.branch)}</td><td>${money(d.total)}</td><td><span class="tag ${balance(d)>0?'red':''}">${money(balance(d))}</span></td><td><button class="btn secondary" onclick="printBill('${d.id}')">Cetak</button></td></tr>`).join(''))}</section>`}function billPage(type,form=false){return title(type==='sale'?'Jualan & Invois':'Pembelian Buah',type==='sale'?'Invois pelanggan, bayaran dan stok keluar':'Rekod pembelian kebun, kos dan stok masuk',`<button class="btn" onclick="newBill('${type}')">＋ ${type==='sale'?'Invois':'Bil Pembelian'} Baru</button>`)+(form?formBill(type):billList(type))}function printBill(id){let d=db.docs.find(x=>x.id===id);if(!d)return;let w=window.open('','_blank');if(!w)return notify('Benarkan pop-up untuk cetak');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.ref)}</title><style>body{font-family:Arial;padding:30px;color:#19352b}table{border-collapse:collapse;width:100%}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>KZ AGRO RESOURCES</h1><h2>${d.type==='sale'?'INVOIS JUALAN':'BIL PEMBELIAN'}</h2><p>No: ${esc(d.ref)} · Tarikh: ${esc(d.date)}<br>${d.type==='sale'?'Pelanggan':'Pembekal'}: ${esc(d.party)}<br>Cawangan: ${esc(d.branch)}</p><table><tr><th>Produk</th><th>Kuantiti</th><th>Harga</th><th>Jumlah</th></tr>${d.items.map(l=>`<tr><td>${esc(l.product)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</table><h2>Jumlah ${money(d.total)}</h2><p>Bayaran: ${money(paid(d))} · Baki: ${money(balance(d))}</p><p>Dokumen dijana daripada rekod setempat.</p></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),250)}
function stockPage(){let rows=branches.flatMap(b=>products.map(p=>({b,p,qty:stock(b,p)}))).filter(x=>x.qty!==0);return title('Stok & Pindahan','Baki mengikut lokasi, gred dan pergerakan stok',`<button class="btn" onclick="document.getElementById('transferform').scrollIntoView({behavior:'smooth'})">↔ Pindah Stok</button>`)+`<div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Stok Semasa</h2></div>${table(['Lokasi','Produk','Baki Unit'],rows.map(x=>`<tr><td>${esc(x.b)}</td><td>${esc(x.p)}</td><td><b>${x.qty.toLocaleString('en-MY')}</b></td></tr>`).join(''))}</section>${panel('Pindahan Stok',`<form id="transferform" onsubmit="saveTransfer(event)"><label>Dari</label><select name="from">${opt(branches,branches[0])}</select><label>Ke</label><select name="to">${opt(branches,branches[1])}</select><label>Produk</label><select name="product">${opt(products,products[0])}</select><label>Kuantiti</label><input type="number" name="qty" min="0.001" step="any" required><div class="spaced"><button class="btn" type="submit">Sahkan Pindahan</button></div></form><p class="muted spaced">Stok ditolak daripada lokasi asal dan ditambah di lokasi penerima dalam satu transaksi.</p>`)}</div><div class="dashboard-grid">${panel('Pelarasan Stok',`<form onsubmit="adjustStock(event)"><label>Lokasi</label><select name="branch">${opt(branches,branches[0])}</select><label>Produk</label><select name="product">${opt(products,products[0])}</select><label>Perubahan kuantiti (+/-)</label><input type="number" name="qty" step="any" required placeholder="Contoh: -5 atau 20"><label>Sebab</label><input name="reason" required placeholder="Rosak / stok awal / pembetulan"><div class="spaced"><button class="btn" type="submit">Rekod Pelarasan</button></div></form>`)}${panel('Pergerakan Terkini',table(['Tarikh','Lokasi','Produk','Perubahan'],db.movements.slice().reverse().slice(0,12).map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.branch)}</td><td>${esc(m.product)}</td><td class="${m.qty<0?'danger-text':'up'}">${m.qty>0?'+':''}${m.qty}</td></tr>`).join('')))}</div>`}function saveTransfer(e){e.preventDefault();let f=new FormData(e.target),from=f.get('from'),to=f.get('to'),product=f.get('product'),qty=num(f.get('qty'));if(from===to)return notify('Lokasi asal dan penerima mesti berbeza');if(qty<=0||stock(from,product)<qty)return notify('Kuantiti tidak sah atau stok tidak mencukupi');let id=uid(),date=today();db.transfers.push({id,date,from,to,product,qty});db.movements.push({id:uid(),date,branch:from,product,qty:-qty,source:id},{id:uid(),date,branch:to,product,qty,source:id});persist();render();notify('Pindahan stok berjaya')}function adjustStock(e){e.preventDefault();let f=new FormData(e.target),branch=f.get('branch'),product=f.get('product'),qty=num(f.get('qty'));if(!qty||stock(branch,product)+qty<0)return notify('Pelarasan tidak sah');let id=uid();db.adjustments.push({id,date:today(),branch,product,qty,reason:f.get('reason')});db.movements.push({id:uid(),date:today(),branch,product,qty,source:id});persist();render();notify('Pelarasan stok direkodkan')}
function debts(){let due=db.docs.filter(d=>balance(d)>.00001);return title('Hutang & Bayaran','Terima bayaran pelanggan dan bayar pembekal')+`<div class="dashboard-grid">${panel('Rekod Baki',table(['Jenis','Nama','No. Bil','Baki'],due.map(d=>`<tr><td>${d.type==='sale'?'Pelanggan':'Pembekal'}</td><td>${esc(d.party)}</td><td>${esc(d.ref)}</td><td><b>${money(balance(d))}</b></td></tr>`).join('')))}${panel('Rekod Bayaran',`<form onsubmit="recordPayment(event)"><label>Pilih Bil Belum Selesai</label><select name="docId" required>${due.map(d=>`<option value="${esc(d.id)}">${esc(d.ref)} · ${esc(d.party)} · ${money(balance(d))}</option>`).join('')}</select><label>Tarikh</label><input name="date" type="date" value="${today()}" required><label>Jumlah RM</label><input name="amount" type="number" min="0.01" step="any" required><label>Akaun</label><select name="account">${opt(accounts,'Maybank')}</select><div class="spaced"><button class="btn" ${due.length?'':'disabled'}>Simpan Bayaran</button></div></form>`)}</div>`}function recordPayment(e){e.preventDefault();let f=new FormData(e.target),d=db.docs.find(x=>x.id===f.get('docId')),amount=num(f.get('amount'));if(!d||amount<=0||amount>balance(d)+.00001)return notify('Jumlah melebihi baki atau tidak sah');addPayment(d,amount,f.get('account'),f.get('date'));persist();render();notify('Bayaran dan baki hutang dikemas kini')}
function bankPage(){let rows=db.bank.slice().reverse();let balances=accounts.map(a=>({name:a,value:db.bank.filter(b=>b.account===a).reduce((x,b)=>x+b.amount,0)}));return title('Tunai & Bank','Lejar aliran masuk, keluar dan pindahan dalaman')+`<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">${balances.map(x=>`<div class="panel kpi"><div class="kpi-top">${x.name}</div><div class="value">${money(x.value)}</div><div class="kpi-foot">Pergerakan direkodkan dalam aplikasi</div></div>`).join('')}</div><div class="dashboard-grid">${panel('Pindahan Antara Akaun',`<form onsubmit="moveMoney(event)"><label>Dari</label><select name="from">${opt(accounts,'Tunai')}</select><label>Ke</label><select name="to">${opt(accounts,'Public Bank')}</select><label>Jumlah RM</label><input name="amount" type="number" step="any" min="0.01" required><label>Catatan</label><input name="note" placeholder="Simpanan harian"><div class="spaced"><button class="btn">Rekod Pindahan</button></div></form><p class="muted spaced">Pindahan dalaman tidak dikira sebagai jualan atau keuntungan.</p>`)}${panel('Perbelanjaan / Modal Awal',`<form onsubmit="recordCash(event)"><label>Jenis</label><select name="kind"><option value="expense">Perbelanjaan</option><option value="opening">Baki awal / modal masuk</option></select><label>Akaun</label><select name="account">${opt(accounts,'Tunai')}</select><label>Jumlah RM</label><input name="amount" type="number" min="0.01" step="any" required><label>Catatan</label><input name="note" required placeholder="Sewa / minyak / modal awal"><div class="spaced"><button class="btn">Simpan Rekod</button></div></form>`)}</div>${panel('Lejar Transaksi',table(['Tarikh','Akaun','Butiran','Masuk / Keluar'],rows.map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.account)}</td><td>${esc(b.description)}</td><td class="${b.amount<0?'danger-text':'up'}">${b.amount>0?'+':''}${money(b.amount)}</td></tr>`).join('')))}`}
function moveMoney(e){e.preventDefault();let f=new FormData(e.target),from=f.get('from'),to=f.get('to'),amount=num(f.get('amount'));if(from===to||amount<=0)return notify('Semak akaun dan jumlah');let id=uid(),desc='Pindahan dalaman: '+String(f.get('note')||'');db.bank.push({id:uid(),date:today(),account:from,amount:-amount,description:desc,source:id},{id:uid(),date:today(),account:to,amount,description:desc,source:id});persist();render();notify('Pindahan direkodkan tanpa menambah jualan')}function recordCash(e){e.preventDefault();let f=new FormData(e.target),amount=num(f.get('amount'));if(amount<=0)return notify('Jumlah tidak sah');let kind=f.get('kind');db.bank.push({id:uid(),date:today(),account:f.get('account'),amount:kind==='expense'?-amount:amount,description:(kind==='expense'?'Belanja: ':'Modal / baki awal: ')+f.get('note'),kind});persist();render();notify('Lejar dikemas kini')}
function reports(){let sales=docs('sale').reduce((a,d)=>a+d.total,0),purchases=docs('purchase').reduce((a,d)=>a+d.total,0),expenses=db.bank.filter(b=>b.kind==='expense').reduce((a,b)=>a-b.amount,0);return title('Laporan Pengurusan','Ringkasan transaksi, jualan dan pembelian')+`<div class="notice">Laporan ini ialah ringkasan operasi, BUKAN untung rugi perakaunan rasmi. Pembelian stok tidak semestinya kos barang terjual; nilai stok akhir, kos barang terjual dan pelarasan lain belum dikira.</div><div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="panel kpi"><div class="kpi-top">Jualan Direkod</div><div class="value">${money(sales)}</div></div><div class="panel kpi"><div class="kpi-top">Pembelian Direkod</div><div class="value">${money(purchases)}</div></div><div class="panel kpi"><div class="kpi-top">Perbelanjaan Direkod</div><div class="value">${money(expenses)}</div></div></div>${panel('Jualan Mengikut Cawangan',table(['Cawangan','Jumlah Jualan','Bilangan Invois'],branches.map(b=>`<tr><td>${esc(b)}</td><td>${money(docs('sale').filter(d=>d.branch===b).reduce((a,d)=>a+d.total,0))}</td><td>${docs('sale').filter(d=>d.branch===b).length}</td></tr>`).join('')))}<div class="spaced">${panel('Eksport Rekod',`<div class="actions"><button class="btn secondary" onclick="exportCSV('sale')">Eksport Jualan CSV</button><button class="btn secondary" onclick="exportCSV('purchase')">Eksport Pembelian CSV</button><button class="btn secondary" onclick="backup()">Sandaran JSON</button></div>`)}</div>`}function exportCSV(type){let a=[['Tarikh','No Bil','Nama','Cawangan','Produk','Kuantiti','Harga Unit','Jumlah Baris','Jumlah Bil','Baki']];docs(type).forEach(d=>d.items.forEach(l=>a.push([d.date,d.ref,d.party,d.branch,l.product,l.qty,l.price,l.qty*l.price,d.total,balance(d)])));download('KZ_'+type+'_'+today()+'.csv','\ufeff'+a.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function download(name,body,type){let blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}function backup(){download('KZ_AGRO_BACKUP_'+today()+'.json',JSON.stringify({format:'kz-owner-v2',exported:new Date().toISOString(),data:db},null,2),'application/json');notify('Sandaran dimuat turun')}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(obj.format!=='kz-owner-v2'||!obj.data||!Array.isArray(obj.data.docs))throw Error('Format salah');if(!confirm('Pulihkan sandaran? Ini akan menggantikan semua data setempat semasa.'))return;db=obj.data;persist();render();notify('Sandaran dipulihkan')}catch(err){notify('Fail sandaran tidak sah')}};r.readAsText(f)}function settings(){return title('Tetapan & Sandaran','Kawalan data peranti dan maklumat sistem')+`<div class="dashboard-grid">${panel('Sandaran Data',`<p class="muted" style="line-height:1.8;margin-bottom:15px">Semua rekod disimpan pada peranti dan pelayar ini sahaja. Simpan fail sandaran di tempat selamat selepas operasi harian.</p><div class="actions"><button class="btn" onclick="backup()">↓ Muat Turun Sandaran</button><label class="btn secondary" style="cursor:pointer;margin:0">↑ Pulihkan Sandaran<input type="file" accept=".json,application/json" onchange="restore(event)" style="display:none"></label></div>`)}${panel('Status Sistem',`<div class="branch"><div class="branch-line"><span>Mod</span><span>Pemilik sahaja</span></div></div><div class="branch"><div class="branch-line"><span>Database</span><span>Setempat (localStorage)</span></div></div><div class="branch"><div class="branch-line"><span>Login pekerja</span><span>Belum tersedia</span></div></div><div class="branch"><div class="branch-line"><span>Sync HQ / Cawangan</span><span>Belum tersedia</span></div></div><div class="branch"><div class="branch-line"><span>Rekod dokumen</span><span>${db.docs.length}</span></div></div>`)}</div>${panel('Panduan Penggunaan',`<p class="muted" style="line-height:1.9">1. Masukkan stok awal melalui Stok &gt; Pelarasan, atau rekod pembelian daripada pembekal.<br>2. Buat invois jualan dengan beberapa produk.<br>3. Bayaran separa direkod melalui Hutang & Bayaran.<br>4. Rekod pindahan antara akaun tanpa menambah jualan.<br>5. Muat turun sandaran selepas setiap sesi.</p>`)}`}
function render(form=false){let html=page==='dashboard'?dashboard():page==='jualan'?billPage('sale',form):page==='pembelian'?billPage('purchase',form):page==='stok'?stockPage():page==='hutang'?debts():page==='bank'?bankPage():page==='laporan'?reports():settings();document.getElementById('app').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}render();
</script></body></html>
