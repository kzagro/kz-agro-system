<!-- KZ Agro Pages Update -->
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KZ Agro Management</title>
<style>
body{font-family:Arial;background:#f1f5f1;margin:0;color:#20352a}
header{background:#176b39;color:white;padding:22px}
header h2{margin:0}
.container{padding:16px}
.card{background:white;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
button{background:#176b39;color:white;border:0;padding:12px;border-radius:8px;width:100%;font-size:16px;margin-top:8px}
h3{color:#176b39}
</style>
</head>
<body>
<header>
<h2>KZ AGRO</h2>
<p>Business Management System</p>
</header>
<div class="container">
<div class="card">
<h3>Dashboard</h3>
<p>Selamat Datang ke Sistem KZ Agro</p>
</div>
<div class="card">
<h3>Pengurusan Pembelian Buah</h3>
<button onclick="alert('Modul Pembelian')">Rekod Pembelian</button>
</div>
<div class="card">
<h3>Pengurusan Stok</h3>
<button onclick="alert('Modul Stok')">Semak Stok</button>
</div>
<div class="card">
<h3>Jualan</h3>
<button onclick="alert('Modul Jualan')">Rekod Jualan</button>
</div>
<div class="card">
<h3>Kewangan</h3>
<button onclick="alert('Modul Kewangan')">Rekod Kewangan</button>
</div>
<div class="card">
<h3>Pekerja & Gaji</h3>
<button onclick="alert('Modul Pekerja')">Pengurusan Pekerja</button>
</div>
</div> 
<div class="card">
  <h3>Rekod Pembelian Buah</h3>

  <input id="pembekal" placeholder="Nama pembekal">
  <input id="buah" placeholder="Jenis buah"> 
<select id="unit">
<option value="KG">KG (Kilogram)</option>
<option value="PCS">PCS (Biji)</option>
</select>

  <input id="kuantiti" type="number"
    placeholder="Kuantiti">
  <input id="harga" type="number"
    placeholder="Harga seunit (RM)">

  <button onclick="kiraBelian()">
    Kira Jumlah
  </button>

  <p id="jumlahBelian"></p>
</> <button type="button" onclick="simpanPembelian()">
  Simpan Pembelian
</button>



<script>
function kiraBelian() {
  let qty = Number(
    document.getElementById("kuantiti").value
  );
  let harga = Number(
    document.getElementById("harga").value
  );

  document.getElementById("jumlahBelian")
    .innerText = "Jumlah: RM " +
    (qty * harga).toFixed(2);
}
</script>

</body>
</html>
