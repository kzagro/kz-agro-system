let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.docs))db={docs:[],payments:[],transfers:[],adjustments:[],movements:[],bank:[],opening:{},settings:{}};for(const k of ['payments','transfers','adjustments','movements','bank'])if(!Array.isArray(db[k]))db[k]=[];if(!Array.isArray(db.catalog))db.catalog=[];const catalogNames=()=>db.catalog.map(x=>x.name);function knownProducts(){return [...new Set([...catalogNames(),...db.movements.map(x=>x.product),...db.docs.flatMap(x=>(x.items||[]).map(y=>y.product))])].filter(Boolean)}let page='dashboard',mode='sale',lines=[{product:'',qty:1,price:0}],lastBill=null;function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function notify(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}function nav(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));function docs(type){return db.docs.filter(d=>d.type===type)}function paid(d){return db.payments.filter(p=>p.docId===d.id).reduce((a,p)=>a+p.amount,0)}function balance(d){return Math.max(0,d.total-paid(d))}function stock(branch,product){return db.movements.filter(m=>m.branch===branch&&m.product===product).reduce((a,m)=>a+m.qty,0)}function revenue(date){return docs('sale').filter(d=>d.date===date).reduce((a,d)=>a+d.total,0)}function previousDay(d){let t=new Date(d+'T12:00:00');t.setDate(t.getDate()-1);return t.toLocaleDateString('en-CA')}function branchSales(b){return docs('sale').filter(d=>d.branch===b&&d.date===today()).reduce((a,d)=>a+d.total,0)}function chart(){const data=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let s=d.toLocaleDateString('en-CA');return{label:d.toLocaleDateString('ms-MY',{day:'numeric',month:'short'}),value:revenue(s)}});const max=Math.max(1,...data.map(x=>x.value));return `<svg class="chart" viewBox="0 0 610 230" preserveAspectRatio="none" role="img" aria-label="Graf jualan tujuh hari">${[0,1,2,3].map(i=>`<line x1="36" y1="${26+i*52}" x2="600" y2="${26+i*52}" stroke="#edf1ed"/><text x="3" y="${30+i*52}">${Math.round(max*(3-i)/3)}</text>`).join('')}${data.map((x,i)=>{let h=150*x.value/max;return `<rect x="${65+i*77}" y="${183-h}" width="39" height="${h}" rx="6" fill="${i===6?'#16865e':'#b6e5ca'}"/><text x="${84+i*77}" y="214" text-anchor="middle">${x.label}</text>`}).join('')}</svg>`}
function dashboard(){let t=revenue(today()),y=revenue(previousDay(today())),diff=y?((t-y)/y*100):null,receiv=docs('sale').reduce((a,d)=>a+balance(d),0),payab=docs('purchase').reduce((a,d)=>a+balance(d),0),sales=docs('sale').slice().reverse().slice(0,6);let max=Math.max(1,...branches.map(branchSales));return title('Dashboard HQ','Ringkasan operasi perniagaan · '+new Date().toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'}),`<button class="btn" onclick="newBill('sale')">＋ Jualan Baru</button>`)+`<div class="notice">VERSI PEMILIK SETEMPAT: Data disimpan dalam pelayar pada peranti ini. Belum ada login, penyegerakan cawangan atau integrasi bank. Jangan gunakan sebagai satu-satunya rekod kewangan rasmi. Eksport sandaran setiap hari.</div><div class="kpis"><div class="panel kpi"><div class="kpi-top">Jualan Hari Ini <span class="kpi-icon">↗</span></div><div class="value">${money(t)}</div><div class="kpi-foot">${diff===null?'Tiada jualan semalam untuk perbandingan':`<span class="${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${Math.abs(diff).toFixed(1)}%</span> berbanding semalam`}</div></div><div class="panel kpi"><div class="kpi-top">Jualan Bulan Ini <span class="kpi-icon">▥</span></div><div class="value">${money(docs('sale').filter(d=>d.date.slice(0,7)===today().slice(0,7)).reduce((a,d)=>a+d.total,0))}</div><div class="kpi-foot">Jumlah invois direkodkan</div></div><div class="panel kpi"><div class="kpi-top">Hutang Pelanggan <span class="kpi-icon">♧</span></div><div class="value">${money(receiv)}</div><div class="kpi-foot">Baki belum diterima</div></div><div class="panel kpi"><div class="kpi-top">Hutang Pembekal <span class="kpi-icon">▤</span></div><div class="value">${money(payab)}</div><div class="kpi-foot">Baki belum dibayar</div></div></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Prestasi Jualan</h2><span class="muted">7 hari terakhir</span></div><div class="panel-body">${chart()}</div></section><section class="panel"><div class="panel-head"><h2>Prestasi Cawangan</h2><span class="muted">Hari ini</span></div><div class="panel-body">${branches.map(b=>`<div class="branch"><div class="branch-line"><span>${esc(b)}</span><span>${money(branchSales(b))}</span></div><div class="bar"><span style="width:${branchSales(b)/max*100}%"></span></div></div>`).join('')}</div></section></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Transaksi Terkini</h2><button class="btn secondary" onclick="nav('jualan')">Lihat Semua</button></div>${table(['Tarikh','No. Invois','Pelanggan','Jumlah'],sales.map(d=>`<tr><td>${esc(d.date)}</td><td>${esc(d.ref)}</td><td>${esc(d.party)}</td><td><b>${money(d.total)}</b></td></tr>`).join(''))}</section>${panel('Tindakan Pantas',`<div class="quick"><button onclick="newBill('sale')"><span>▤</span>Jualan</button><button onclick="newBill('purchase')"><span>🛒</span>Beli Buah</button><button onclick="nav('stok')"><span>▣</span>Semak Stok</button><button onclick="nav('hutang')"><span>♧</span>Hutang</button></div><p class="muted spaced">Pembelian dan jualan akan mengemas kini stok serta baki hutang secara automatik.</p>`)}</div>`}
function newBill(type){mode=type;lines=[{product:'',qty:1,price:0}];page=type==='sale'?'jualan':'pembelian';render(true)}function lineHTML(){return lines.map((l,i)=>`<div class="product-card line-row"><div class="product-card-head"><strong>Produk ${i+1}</strong><button type="button" class="mini-remove" onclick="removeLine(${i})" aria-label="Buang produk">✕ Buang</button></div><div class="product-fields"><div class="product-name"><label>Produk / Gred</label><input list="kz-items-${i}" placeholder="Taip jenis buah / gred sendiri" value="${esc(l.product)}" onchange="changeLine(${i},'product',this.value);choosePrice(${i},this.value)" aria-label="Nama produk dan gred"><datalist id="kz-items-${i}">${knownProducts().map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div><div><label>Kuantiti</label><input type="number" inputmode="decimal" min="0.001" step="any" value="${l.qty}" oninput="changeLine(${i},'qty',this.value)"></div><div><label>Harga Seunit (RM)</label><input type="number" inputmode="decimal" min="0" step="any" value="${l.price}" oninput="changeLine(${i},'price',this.value)"></div></div><div class="product-subtotal"><span>Jumlah produk</span><strong data-subtotal>${money(num(l.qty)*num(l.price))}</strong></div></div>`).join('')}
function refreshLineTotals(){document.querySelectorAll('#lineholder .line-row').forEach((row,i)=>{let output=row.querySelector('[data-subtotal]');if(output&&lines[i])output.textContent=money(num(lines[i].qty)*num(lines[i].price))});let sum=lines.reduce((a,l)=>a+num(l.qty)*num(l.price),0);let total=document.getElementById('lineTotal');if(total)total.textContent=money(sum);let initial=num(document.querySelector('#billform [name=initial]')?.value);let due=document.getElementById('dueTotal');if(due)due.textContent=money(Math.max(0,sum-initial))}

function manualStockUI(){return `<section class="panel" id="manualstock"><div class="panel-head"><h2>Tambah Stok Manual & Daftar Produk</h2></div><div class="panel-body"><p class="muted">Nama buah, gred, unit dan harga ditentukan oleh pemilik. Satu borang boleh menambah beberapa item.</p><form onsubmit="saveManualStock(event)"><label>Tarikh</label><input name="date" type="date" value="${today()}" required><label>Lokasi stok</label><select name="branch">${opt(branches,branches[0])}</select><div id="manualRows"></div><button type="button" class="btn secondary" onclick="addManualRow()">＋ Tambah Produk / Gred</button><label>Catatan / Rujukan</label><input name="reason" placeholder="Stok awal / kiraan fizikal / pelarasan"><div class="spaced"><button class="btn" type="submit">Simpan Stok Manual</button></div></form></div></section>`}
let manualRows=[{name:'',grade:'',unit:'',qty:'',buy:'',sell:''}];
function drawManualRows(){let el=document.getElementById('manualRows');if(!el)return;el.innerHTML=manualRows.map((r,i)=>`<div class="product-card" style="margin:14px 0;padding:16px"><div class="product-card-head"><strong>Item ${i+1}</strong><button type="button" class="mini-remove" onclick="removeManualRow(${i})">✕ Buang</button></div><label>Jenis buah / produk</label><input list="manualProducts" placeholder="Taip sendiri" value="${esc(r.name)}" oninput="manualRows[${i}].name=this.value"><label>Gred (jika ada)</label><input placeholder="Taip sendiri, boleh kosong" value="${esc(r.grade)}" oninput="manualRows[${i}].grade=this.value"><label>Unit</label><input placeholder="biji / kg / kotak / lain-lain" value="${esc(r.unit)}" oninput="manualRows[${i}].unit=this.value"><label>Kuantiti stok masuk</label><input type="number" inputmode="decimal" min="0.001" step="any" value="${esc(r.qty)}" oninput="manualRows[${i}].qty=this.value"><label>Harga belian seunit (RM, pilihan)</label><input type="number" inputmode="decimal" min="0" step="any" value="${esc(r.buy)}" oninput="manualRows[${i}].buy=this.value"><label>Harga jualan seunit (RM, pilihan)</label><input type="number" inputmode="decimal" min="0" step="any" value="${esc(r.sell)}" oninput="manualRows[${i}].sell=this.value"></div>`).join('')+`<datalist id="manualProducts">${catalogNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`}
function addManualRow(){manualRows.push({name:'',grade:'',unit:'',qty:'',buy:'',sell:''});drawManualRows()}
function removeManualRow(i){if(manualRows.length===1)return notify('Sekurang-kurangnya satu item');manualRows.splice(i,1);drawManualRows()}
function saveManualStock(e){e.preventDefault();let f=new FormData(e.target),branch=f.get('branch'),date=f.get('date'),entries=manualRows.map(r=>({...r,name:String(r.name).trim(),grade:String(r.grade).trim(),unit:String(r.unit).trim(),qty:Number(r.qty)}));if(entries.some(r=>!r.name||!r.unit||!Number.isFinite(r.qty)||r.qty<=0))return notify('Isi nama produk, unit dan kuantiti yang sah');for(let r of entries){let product=[r.name,r.grade].filter(Boolean).join(' / ');let found=db.catalog.find(x=>x.name===product);let rec={name:product,unit:r.unit,buy:Number(r.buy)||0,sell:Number(r.sell)||0};if(found)Object.assign(found,rec);else db.catalog.push(rec);let id=uid();db.adjustments.push({id,date,branch,product,qty:r.qty,reason:String(f.get('reason')||'Stok masuk manual')});db.movements.push({id:uid(),date,branch,product,qty:r.qty,source:id})}persist();manualRows=[{name:'',grade:'',unit:'',qty:'',buy:'',sell:''}];render();notify('Stok manual disimpan: '+entries.length+' item')}
function choosePrice(i,name){let p=db.catalog.find(x=>x.name===name);if(p){lines[i].price=Number(mode==='purchase'?p.buy:p.sell)||0;let row=document.querySelectorAll('#lineholder .line-row')[i];if(row){let inp=row.querySelectorAll('input[type=number]')[1];if(inp)inp.value=lines[i].price}}refreshLineTotals()}
function stockPage(){let rows=branches.flatMap(b=>knownProducts().map(p=>({b,p,qty:stock(b,p)}))).filter(x=>x.qty!==0);return title('Stok & Pindahan','Daftar produk sendiri, masukkan stok manual dan pindah antara lokasi',`<button class="btn" onclick="document.getElementById('manualstock').scrollIntoView({behavior:'smooth'})">＋ Tambah Stok Manual</button>`)+manualStockUI()+`<div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Stok Semasa</h2></div>${table(['Lokasi','Produk','Baki Unit'],rows.map(x=>`<tr><td>${esc(x.b)}</td><td>${esc(x.p)}</td><td><b>${x.qty.toLocaleString('en-MY')}</b></td></tr>`).join(''))}</section>${panel('Pindahan Stok',`<form id="transferform" onsubmit="saveTransfer(event)"><label>Dari</label><select name="from">${opt(branches,branches[0])}</select><label>Ke</label><select name="to">${opt(branches,branches[1])}</select><label>Produk</label><select name="product">${opt(knownProducts(),'')}</select><label>Kuantiti</label><input type="number" name="qty" min="0.001" step="any" required><div class="spaced"><button class="btn" type="submit">Sahkan Pindahan</button></div></form><p class="muted spaced">Stok ditolak daripada lokasi asal dan ditambah di lokasi penerima dalam satu transaksi.</p>`)}</div><div class="dashboard-grid">${panel('Pelarasan Stok',`<form onsubmit="adjustStock(event)"><label>Lokasi</label><select name="branch">${opt(branches,branches[0])}</select><label>Produk</label><select name="product">${opt(knownProducts(),'')}</select><label>Perubahan kuantiti (+/-)</label><input type="number" name="qty" step="any" required placeholder="Contoh: -5 atau 20"><label>Sebab</label><input name="reason" required placeholder="Rosak / stok awal / pembetulan"><div class="spaced"><button class="btn" type="submit">Rekod Pelarasan</button></div></form>`)}${panel('Pergerakan Terkini',table(['Tarikh','Lokasi','Produk','Perubahan'],db.movements.slice().reverse().slice(0,12).map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.branch)}</td><td>${esc(m.product)}</td><td class="${m.qty<0?'danger-text':'up'}">${m.qty>0?'+':''}${m.qty}</td></tr>`).join('')))}</div>`}function saveTransfer(e){e.preventDefault();let f=new FormData(e.target),from=f.get('from'),to=f.get('to'),product=f.get('product'),qty=num(f.get('qty'));if(!product)return notify('Daftar produk dan stok dahulu');if(from===to)return notify('Lokasi asal dan penerima mesti berbeza');if(qty<=0||stock(from,product)<qty)return notify('Kuantiti tidak sah atau stok tidak mencukupi');let id=uid(),date=today();db.transfers.push({id,date,from,to,product,qty});db.movements.push({id:uid(),date,branch:from,product,qty:-qty,source:id},{id:uid(),date,branch:to,product,qty,source:id});persist();render();notify('Pindahan stok berjaya')}function adjustStock(e){e.preventDefault();let f=new FormData(e.target),branch=f.get('branch'),product=f.get('product'),qty=num(f.get('qty'));if(!qty||stock(branch,product)+qty<0)return notify('Pelarasan tidak sah');let id=uid();db.adjustments.push({id,date:today(),branch,product,qty,reason:f.get('reason')});db.movements.push({id:uid(),date:today(),branch,product,qty,source:id});persist();render();notify('Pelarasan stok direkodkan')}
function debts(){let due=db.docs.filter(d=>balance(d)>.00001);return title('Hutang & Bayaran','Terima bayaran pelanggan dan bayar pembekal')+`<div class="dashboard-grid">${panel('Rekod Baki',table(['Jenis','Nama','No. Bil','Baki'],due.map(d=>`<tr><td>${d.type==='sale'?'Pelanggan':'Pembekal'}</td><td>${esc(d.party)}</td><td>${esc(d.ref)}</td><td><b>${money(balance(d))}</b></td></tr>`).join('')))}${panel('Rekod Bayaran',`<form onsubmit="recordPayment(event)"><label>Pilih Bil Belum Selesai</label><select name="docId" required>${due.map(d=>`<option value="${esc(d.id)}">${esc(d.ref)} · ${esc(d.party)} · ${money(balance(d))}</option>`).join('')}</select><label>Tarikh</label><input name="date" type="date" value="${today()}" required><label>Jumlah RM</label><input name="amount" type="number" min="0.01" step="any" required><label>Akaun</label><select name="account">${opt(accounts,'Maybank')}</select><div class="spaced"><button class="btn" ${due.length?'':'disabled'}>Simpan Bayaran</button></div></form>`)}</div>`}function recordPayment(e){e.preventDefault();let f=new FormData(e.target),d=db.docs.find(x=>x.id===f.get('docId')),amount=num(f.get('amount'));if(!d||amount<=0||amount>balance(d)+.00001)return notify('Jumlah melebihi baki atau tidak sah');addPayment(d,amount,f.get('account'),f.get('date'));persist();render();notify('Bayaran dan baki hutang dikemas kini')}
function bankPage(){let rows=db.bank.slice().reverse();let balances=accounts.map(a=>({name:a,value:db.bank.filter(b=>b.account===a).reduce((x,b)=>x+b.amount,0)}));return title('Tunai & Bank','Lejar aliran masuk, keluar dan pindahan dalaman')+`<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">${balances.map(x=>`<div class="panel kpi"><div class="kpi-top">${x.name}</div><div class="value">${money(x.value)}</div><div class="kpi-foot">Pergerakan direkodkan dalam aplikasi</div></div>`).join('')}</div><div class="dashboard-grid">${panel('Pindahan Antara Akaun',`<form onsubmit="moveMoney(event)"><label>Dari</label><select name="from">${opt(accounts,'Tunai')}</select><label>Ke</label><select name="to">${opt(accounts,'Public Bank')}</select><label>Jumlah RM</label><input name="amount" type="number" step="any" min="0.01" required><label>Catatan</label><input name="note" placeholder="Simpanan harian"><div class="spaced"><button class="btn">Rekod Pindahan</button></div></form><p class="muted spaced">Pindahan dalaman tidak dikira sebagai jualan atau keuntungan.</p>`)}${panel('Perbelanjaan / Modal Awal',`<form onsubmit="recordCash(event)"><label>Jenis</label><select name="kind"><option value="expense">Perbelanjaan</option><option value="opening">Baki awal / modal masuk</option></select><label>Akaun</label><select name="account">${opt(accounts,'Tunai')}</select><label>Jumlah RM</label><input name="amount" type="number" min="0.01" step="any" required><label>Catatan</label><input name="note" required placeholder="Sewa / minyak / modal awal"><div class="spaced"><button class="btn">Simpan Rekod</button></div></form>`)}</div>${panel('Lejar Transaksi',table(['Tarikh','Akaun','Butiran','Masuk / Keluar'],rows.map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.account)}</td><td>${esc(b.description)}</td><td class="${b.amount<0?'danger-text':'up'}">${b.amount>0?'+':''}${money(b.amount)}</td></tr>`).join('')))}`}
function moveMoney(e){e.preventDefault();let f=new FormData(e.target),from=f.get('from'),to=f.get('to'),amount=num(f.get('amount'));if(from===to||amount<=0)return notify('Semak akaun dan jumlah');let id=uid(),desc='Pindahan dalaman: '+String(f.get('note')||'');db.bank.push({id:uid(),date:today(),account:from,amount:-amount,description:desc,source:id},{id:uid(),date:today(),account:to,amount,description:desc,source:id});persist();render();notify('Pindahan direkodkan tanpa menambah jualan')}function recordCash(e){e.preventDefault();let f=new FormData(e.target),amount=num(f.get('amount'));if(amount<=0)return notify('Jumlah tidak sah');let kind=f.get('kind');db.bank.push({id:uid(),date:today(),account:f.get('account'),amount:kind==='expense'?-amount:amount,description:(kind==='expense'?'Belanja: ':'Modal / baki awal: ')+f.get('note'),kind});persist();render();notify('Lejar dikemas kini')}
function reports(){let sales=docs('sale').reduce((a,d)=>a+d.total,0),purchases=docs('purchase').reduce((a,d)=>a+d.total,0),expenses=db.bank.filter(b=>b.kind==='expense').reduce((a,b)=>a-b.amount,0);return title('Laporan Pengurusan','Ringkasan transaksi, jualan dan pembelian')+`<div class="notice">Laporan ini ialah ringkasan operasi, BUKAN untung rugi perakaunan rasmi. Pembelian stok tidak semestinya kos barang terjual; nilai stok akhir, kos barang terjual dan pelarasan lain belum dikira.</div><div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="panel kpi"><div class="kpi-top">Jualan Direkod</div><div class="value">${money(sales)}</div></div><div class="panel kpi"><div class="kpi-top">Pembelian Direkod</div><div class="value">${money(purchases)}</div></div><div class="panel kpi"><div class="kpi-top">Perbelanjaan Direkod</div><div class="value">${money(expenses)}</div></div></div>${panel('Jualan Mengikut Cawangan',table(['Cawangan','Jumlah Jualan','Bilangan Invois'],branches.map(b=>`<tr><td>${esc(b)}</td><td>${money(docs('sale').filter(d=>d.branch===b).reduce((a,d)=>a+d.total,0))}</td><td>${docs('sale').filter(d=>d.branch===b).length}</td></tr>`).join('')))}<div class="spaced">${panel('Eksport Rekod',`<div class="actions"><button class="btn secondary" onclick="exportCSV('sale')">Eksport Jualan CSV</button><button class="btn secondary" onclick="exportCSV('purchase')">Eksport Pembelian CSV</button><button class="btn secondary" onclick="backup()">Sandaran JSON</button></div>`)}</div>`}function exportCSV(type){let a=[['Tarikh','No Bil','Nama','Cawangan','Produk','Kuantiti','Harga Unit','Jumlah Baris','Jumlah Bil','Baki']];docs(type).forEach(d=>d.items.forEach(l=>a.push([d.date,d.ref,d.party,d.branch,l.product,l.qty,l.price,l.qty*l.price,d.total,balance(d)])));download('KZ_'+type+'_'+today()+'.csv','\ufeff'+a.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function download(name,body,type){let blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}function backup(){download('KZ_AGRO_BACKUP_'+today()+'.json',JSON.stringify({format:'kz-owner-v2',exported:new Date().toISOString(),data:db},null,2),'application/json');notify('Sandaran dimuat turun')}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(obj.format!=='kz-owner-v2'||!obj.data||!Array.isArray(obj.data.docs))throw Error('Format salah');if(!confirm('Pulihkan sandaran? Ini akan menggantikan semua data setempat semasa.'))return;db=obj.data;persist();render();notify('Sandaran dipulihkan')}catch(err){notify('Fail sandaran tidak sah')}};r.readAsText(f)}function settings(){return title('Tetapan & Sandaran','Kawalan data peranti dan maklumat sistem')+`<div class="dashboard-grid">${panel('Sandaran Data',`<p class="muted" style="line-height:1.8;margin-bottom:15px">Semua rekod disimpan pada peranti dan pelayar ini sahaja. Simpan fail sandaran di tempat selamat selepas operasi harian.</p><div class="actions"><button class="btn" onclick="backup()">↓ Muat Turun Sandaran</button><label class="btn secondary" style="cursor:pointer;margin:0">↑ Pulihkan Sandaran<input type="file" accept=".json,application/json" onchange="restore(event)" style="display:none"></label></div>`)}${panel('Status Sistem',`<div class="branch"><div class="branch-line"><span>Mod</span><span>Pemilik sahaja</span></div></div><div class="branch"><div class="branch-line"><span>Database</span><span>Setempat (localStorage)</span></div></div><div class="branch"><div class="branch-line"><span>Login pekerja</span><span>Belum tersedia</span></div></div><div class="branch"><div class="branch-line"><span>Sync HQ / Cawangan</span><span>Belum tersedia</span></div></div><div class="branch"><div class="branch-line"><span>Rekod dokumen</span><span>${db.docs.length}</span></div></div>`)}</div>${panel('Panduan Penggunaan',`<p class="muted" style="line-height:1.9">1. Masukkan stok awal melalui Stok &gt; Tambah Stok Manual, atau rekod pembelian daripada pembekal.<br>2. Buat invois jualan dengan beberapa produk.<br>3. Bayaran separa direkod melalui Hutang & Bayaran.<br>4. Rekod pindahan antara akaun tanpa menambah jualan.<br>5. Muat turun sandaran selepas setiap sesi.</p>`)}`}
function render(form=false){let html=page==='dashboard'?dashboard():page==='jualan'?billPage('sale',form):page==='pembelian'?billPage('purchase',form):page==='stok'?stockPage():page==='hutang'?debts():page==='bank'?bankPage():page==='laporan'?reports():settings();document.getElementById('app').innerHTML=html;if(page==='stok')drawManualRows();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}render();
</script></body></html>
